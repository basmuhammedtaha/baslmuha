<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IST2 Picker &amp; Floor Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --border:#334155;
  --primary:#3b82f6;--primary-dim:#1e40af;
  --success:#22c55e;--warning:#f59e0b;--error:#ef4444;--info:#06b6d4;
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Cascadia Code','SF Mono',Consolas,monospace;
  --radius:10px
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:16px;min-height:100vh}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:14px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius)}
.header-left{display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:700}
.header h1 span{color:var(--success)}
.header-right{display:flex;align-items:center;gap:10px}
.last-update{font-size:11px;color:var(--text3);font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-fc{background:var(--primary-dim);color:var(--primary)}
.conn-status{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
.conn-status.connected{background:#22c55e20;color:#4ade80}
.conn-status.waiting{background:#f59e0b20;color:#fbbf24}
.conn-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.conn-status.connected .dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* FILTER BARS */
.filter-bar{display:flex;gap:4px;margin-bottom:10px;background:var(--bg2);border-radius:var(--radius);padding:4px;border:1px solid var(--border);overflow-x:auto;align-items:center}
.filter-bar .label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:0 8px;white-space:nowrap}
.tab{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;color:var(--text3);border:none;background:transparent;font-family:var(--font)}
.tab:hover{background:var(--bg3);color:var(--text2)}
.tab.active{background:var(--primary);color:#fff}
.tab .cnt{font-family:var(--mono);font-size:9px;opacity:.8;margin-left:2px}

/* Floor tabs custom colors */
.tab.floor-tab.active[data-floor="HRV"]{background:#64748b}
.tab.floor-tab.active[data-floor="P1"]{background:#6366f1}
.tab.floor-tab.active[data-floor="P2"]{background:#0ea5e9}
.tab.floor-tab.active[data-floor="P3"]{background:#8b5cf6}
.tab.floor-tab.active[data-floor="P4"]{background:#06b6d4}
.tab.floor-tab.active[data-floor="P5"]{background:#f59e0b}
.tab.floor-tab.active[data-floor="P6"]{background:#ec4899}

/* SUMMARY */
.summary-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.summary-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;text-align:center;min-width:90px;flex-shrink:0;cursor:pointer;transition:all .2s}
.summary-card:hover{border-color:var(--primary-dim)}
.summary-card.active-fl{border-color:var(--success);background:#22c55e10}
.summary-card .s-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;white-space:nowrap}
.summary-card .s-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.summary-card.total-card{border-color:var(--primary-dim)}
.summary-card.total-card .s-value{color:var(--primary)}

/* THRESHOLD BAR */
.thr-bar{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:8px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--text3);flex-wrap:wrap}
.thr-bar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.thr-bar .dot.ok{background:var(--success)}.thr-bar .dot.warn{background:var(--warning)}.thr-bar .dot.crit{background:var(--error)}
.thr-bar input{width:48px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;padding:3px 6px;font-family:var(--mono);outline:none}
.thr-bar input:focus{border-color:var(--primary)}
.thr-bar button{background:var(--success);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font)}

/* CPT SECTIONS */
.cpt-section{margin-bottom:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cpt-section.has-crit{border-color:#ef444480}
.cpt-section.has-warn{border-color:#f59e0b60}
.cpt-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg3);cursor:pointer;user-select:none;gap:12px;flex-wrap:wrap}
.cpt-header:hover{background:#3b4a5e}
.cpt-header .left{display:flex;align-items:center;gap:10px}
.cpt-header .chv{font-size:10px;color:var(--text3);transition:transform .2s}
.cpt-header .chv.open{transform:rotate(90deg);color:var(--success)}
.cpt-header .cpt-label{font-size:15px;font-weight:800;letter-spacing:.5px}
.cpt-header .countdown{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700}
.countdown.late{background:#ef444430;color:#f87171;border:1px solid #ef444450}
.countdown.soon{background:#f59e0b30;color:#fbbf24;border:1px solid #f59e0b50}
.countdown.ok{background:#22c55e20;color:#4ade80;border:1px solid #22c55e40}
.cpt-header .stats{display:flex;gap:16px;align-items:center}
.cpt-header .stat{text-align:center}
.cpt-header .stat-val{font-size:18px;font-weight:800;font-family:var(--mono);line-height:1}
.cpt-header .stat-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cpt-body{display:none;overflow-x:auto}
.cpt-body.open{display:block}

/* TABLE */
.tote-table{width:100%;border-collapse:collapse;font-size:11px}
.tote-table th{text-align:left;padding:7px 10px;font-weight:700;color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tote-table td{padding:6px 10px;border-bottom:1px solid rgba(51,65,85,.3);color:var(--text);font-size:11px}
.tote-table tr:hover td{background:rgba(59,130,246,.06)}
.tote-table tr.row-crit td{border-left:3px solid var(--error)}
.tote-table tr.row-warn td{border-left:3px solid var(--warning)}

/* BADGES */
.dwell-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono)}
.dwell-badge.crit{background:#ef444425;color:#f87171}.dwell-badge.warn{background:#f59e0b25;color:#fbbf24}.dwell-badge.ok{background:#22c55e20;color:#4ade80}

.pp-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--mono)}
.pp-noslam{background:#f59e0b20;color:#fbbf24}.pp-single{background:#3b82f620;color:#60a5fa}
.pp-multi{background:#22c55e20;color:#4ade80}.pp-hov{background:#06b6d420;color:#22d3ee}
.pp-wrap{background:#a78bfa20;color:#c4b5fd}.pp-hotpick{background:#ef444420;color:#f87171}
.pp-other{background:#64748b20;color:#94a3b8}

.floor-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}
.floor-HRV{background:#64748b25;color:#94a3b8}.floor-P1{background:#6366f125;color:#a5b4fc}
.floor-P2{background:#0ea5e925;color:#38bdf8}.floor-P3{background:#8b5cf625;color:#c4b5fd}
.floor-P4{background:#06b6d425;color:#22d3ee}.floor-P5{background:#f59e0b25;color:#fbbf24}
.floor-P6{background:#ec489925;color:#f472b6}

.scannable-link{color:var(--info);text-decoration:none;font-family:var(--mono);font-weight:600;font-size:11px}
.scannable-link:hover{text-decoration:underline;color:#22d3ee}
.picker-text{color:#a78bfa;font-weight:700;font-size:11px}
.picker-na{color:var(--text3);font-size:10px}

.msg-btn{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:5px;padding:2px 8px;font-size:10px;cursor:pointer;font-weight:600;transition:all .15s;font-family:var(--font)}
.msg-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(99,102,241,.4)}
.msg-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg-btn.sent{background:linear-gradient(135deg,#22c55e,#16a34a)}

/* WP section headers */
.wp-group{margin-bottom:16px}
.wp-group-header{font-size:13px;font-weight:700;color:var(--text2);padding:8px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;gap:8px;cursor:pointer}
.wp-group-header i{color:var(--text3)}
.wp-group-header .total{margin-left:auto;font-family:var(--mono);color:var(--primary);font-size:14px;font-weight:800}

/* MSG MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:var(--font)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal .to{font-size:12px;color:var(--text2);margin-bottom:10px}
.modal .to strong{color:#a78bfa}
.modal .templates{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.modal .tpl{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;text-align:left;font-family:var(--font);width:100%}
.modal .tpl:hover{border-color:var(--primary);color:var(--primary)}
.modal .tpl.selected{border-color:var(--primary);background:#3b82f615;color:var(--primary)}
.modal textarea{width:100%;height:70px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;resize:vertical}
.modal textarea:focus{border-color:var(--success)}
.modal .actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal .btn-send{background:linear-gradient(135deg,var(--success),#16a34a);color:#fff;border:none;border-radius:8px;padding:7px 20px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)}
.modal .btn-cancel{background:var(--bg3);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.modal .btn-cancel:hover{border-color:var(--error);color:var(--error)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state i{font-size:48px;margin-bottom:16px;display:block;color:var(--bg3)}
.empty-state h3{color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:13px;line-height:1.6;max-width:500px;margin:0 auto}

.btn-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:13px;transition:all .2s}
.btn-icon:hover{border-color:var(--primary);color:var(--primary)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1><i class="fa-solid fa-building" style="color:var(--success)"></i> IST2 <span>Picker &amp; Floor Tracker</span></h1>
    <span class="badge badge-fc"><i class="fa-solid fa-building"></i> IST2</span>
  </div>
  <div class="header-right">
    <div class="conn-status waiting" id="connStatus"><span class="dot"></span><span id="connLabel">Bekleniyor</span></div>
    <span class="last-update" id="lastUpdate">—</span>
    <button class="btn-icon" onclick="checkStorage()" title="Yenile"><i class="fa-solid fa-rotate"></i></button>
  </div>
</div>

<!-- FLOOR FILTER -->
<div class="filter-bar" id="floorBar">
  <span class="label">🏢 Kat</span>
</div>

<!-- PP FILTER -->
<div class="filter-bar" id="ppBar">
  <span class="label">📋 PP</span>
</div>

<!-- WP FILTER -->
<div class="filter-bar" id="wpBar">
  <span class="label">📦 WP</span>
</div>

<!-- THRESHOLD -->
<div class="thr-bar">
  <span><span class="dot ok"></span> OK</span>
  <span><span class="dot warn"></span> Warning</span>
  <span><span class="dot crit"></span> Critical</span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
    ⚠️ Warn (dk): <input id="thrWarn" type="number" value="30" min="1">
    🔴 Crit (dk): <input id="thrCrit" type="number" value="60" min="1">
    <button onclick="applyThreshold()">Uygula</button>
  </span>
</div>

<!-- SUMMARY -->
<div class="summary-row" id="summaryRow"></div>

<!-- CPT FILTER -->
<div class="filter-bar" id="cptBar" style="display:none">
  <span class="label">⏰ CPT</span>
</div>

<!-- BODY -->
<div id="mainBody">
  <div class="empty-state" id="emptyState">
    <i class="fa-solid fa-satellite-dish"></i>
    <h3>Rodeo Bağlantısı Bekleniyor</h3>
    <p>Tampermonkey script Rodeo'da çalıştığında picker &amp; floor verisi otomatik gelecek.</p>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let pickerData = null;
let currentFloor = 'ALL';
let currentPP = 'ALL';
let currentWP = 'ALL';
let currentCPT = 'ALL';
let warnThr = 30;
let critThr = 60;

const MSG_TEMPLATES = [
  'Selamlar kolay gelsin, üzerindeki {id} tote\'u gönderebilir misin, teşekkürler.',
  '{id} tote\'u lütfen kontrol et.',
  'CPT yaklaşıyor, {id} acil gönderilmesi lazım.',
];

const KNOWN_PP = {
  'PPSingleNoSLAM':      { label:'NoSLAM',   icon:'📦', cls:'pp-noslam' },
  'PPSingleMedium':      { label:'Single',   icon:'📋', cls:'pp-single' },
  'PPMultiMediumZone':   { label:'Multi',    icon:'📚', cls:'pp-multi' },
  'PPHOVSLAPSmall':      { label:'HOV/SLAP', icon:'🏷️', cls:'pp-hov' },
  'PPHOV':               { label:'HOV',      icon:'🏷️', cls:'pp-hov' },
  'PPMultiWrap':         { label:'Wrap',     icon:'🎁', cls:'pp-wrap' },
  'GiftWrap':            { label:'GiftWrap', icon:'🎁', cls:'pp-wrap' },
  'PPSingleNoSLAMSmall': { label:'NoSLAM-S', icon:'📦', cls:'pp-noslam' },
  'PPHOVSLAPLarge':      { label:'HOV-L',    icon:'🏷️', cls:'pp-hov' },
};

const WP_LABELS = {
  'PickingPickedInTransit':'Transit',
  'PickingPickedAtDestination':'Destination',
  'PickingNotYetPicked':'Not Yet Picked',
  'ReadyToPick':'Ready To Pick',
};

const FLOOR_COLORS = {
  HRV:'#64748b', P1:'#6366f1', P2:'#0ea5e9', P3:'#8b5cf6',
  P4:'#06b6d4', P5:'#f59e0b', P6:'#ec4899'
};

function ppInfo(name) {
  if (KNOWN_PP[name]) return KNOWN_PP[name];
  const n = (name||'').toUpperCase();
  if (n.includes('NOSLAM')) return { label:name, icon:'📦', cls:'pp-noslam' };
  if (n.includes('SINGLE')) return { label:name, icon:'📋', cls:'pp-single' };
  if (n.includes('MULTI') && n.includes('WRAP')) return { label:name, icon:'🎁', cls:'pp-wrap' };
  if (n.includes('MULTI')) return { label:name, icon:'📚', cls:'pp-multi' };
  if (n.includes('HOV')) return { label:name, icon:'🏷️', cls:'pp-hov' };
  if (n.includes('WRAP')||n.includes('GIFT')) return { label:name, icon:'🎁', cls:'pp-wrap' };
  return { label:name, icon:'📄', cls:'pp-other' };
}

// ═══════════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════════
function checkStorage() {
  try {
    const stored = localStorage.getItem('ist2_picker_data');
    if (!stored) return;
    const data = JSON.parse(stored);
    if (!data || !data.totes) return;
    loadData(data);
  } catch(e) { console.error('Parse error:', e); }
}

function loadData(data) {
  pickerData = data;
  const time = data.timestamp
    ? new Date(data.timestamp).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
    : '--';
  document.getElementById('lastUpdate').textContent = `${time} — ${data.stats?.totalTotes || 0} tote · ${data.stats?.totalItems || 0} item`;
  document.getElementById('connStatus').className = 'conn-status connected';
  document.getElementById('connLabel').textContent = 'Rodeo bağlı';
  document.getElementById('emptyState').style.display = 'none';

  buildFilters();
  render();
}

setInterval(checkStorage, 8000);
checkStorage();

// ═══════════════════════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════════════════════
function buildFilters() {
  if (!pickerData) return;
  const totes = pickerData.totes;

  // Floor filter
  const floorCounts = {};
  totes.forEach(t => { const f = t.floor || 'N/A'; floorCounts[f] = (floorCounts[f]||0) + 1; });
  const floorBar = document.getElementById('floorBar');
  floorBar.innerHTML = '<span class="label">🏢 Kat</span>';
  const allFloorBtn = mkTab('ALL', 'Tümü (' + totes.length + ')', currentFloor==='ALL', () => { currentFloor='ALL'; buildFilters(); render(); });
  floorBar.appendChild(allFloorBtn);
  ['HRV','P1','P2','P3','P4','P5','P6'].forEach(fl => {
    if (!floorCounts[fl]) return;
    const btn = mkTab(fl, fl + ' (' + floorCounts[fl] + ')', currentFloor===fl, () => { currentFloor=fl; buildFilters(); render(); });
    btn.classList.add('floor-tab');
    btn.dataset.floor = fl;
    floorBar.appendChild(btn);
  });
  if (floorCounts['N/A']) {
    const btn = mkTab('N/A', 'Bilinmeyen (' + floorCounts['N/A'] + ')', currentFloor==='N/A', () => { currentFloor='N/A'; buildFilters(); render(); });
    floorBar.appendChild(btn);
  }

  // PP filter
  const ppCounts = {};
  totes.forEach(t => { ppCounts[t.processPath] = (ppCounts[t.processPath]||0) + 1; });
  const ppBarEl = document.getElementById('ppBar');
  ppBarEl.innerHTML = '<span class="label">📋 PP</span>';
  ppBarEl.appendChild(mkTab('ALL', 'Tümü', currentPP==='ALL', () => { currentPP='ALL'; buildFilters(); render(); }));
  Object.keys(ppCounts).sort().forEach(pp => {
    const info = ppInfo(pp);
    ppBarEl.appendChild(mkTab(pp, info.icon + ' ' + info.label + ' (' + ppCounts[pp] + ')', currentPP===pp, () => { currentPP=pp; buildFilters(); render(); }));
  });

  // WP filter
  const wpCounts = {};
  totes.forEach(t => { const g = t.groupWP || t.workPool; wpCounts[g] = (wpCounts[g]||0) + 1; });
  const wpBarEl = document.getElementById('wpBar');
  wpBarEl.innerHTML = '<span class="label">📦 WP</span>';
  wpBarEl.appendChild(mkTab('ALL', 'Tümü', currentWP==='ALL', () => { currentWP='ALL'; buildFilters(); render(); }));
  Object.keys(wpCounts).sort().forEach(wp => {
    const label = WP_LABELS[wp] || wp;
    wpBarEl.appendChild(mkTab(wp, label + ' (' + wpCounts[wp] + ')', currentWP===wp, () => { currentWP=wp; buildFilters(); render(); }));
  });

  // CPT filter
  const cptCounts = {};
  totes.forEach(t => { cptCounts[t.cpt] = (cptCounts[t.cpt]||0) + 1; });
  const cptBarEl = document.getElementById('cptBar');
  cptBarEl.style.display = 'flex';
  cptBarEl.innerHTML = '<span class="label">⏰ CPT</span>';
  cptBarEl.appendChild(mkTab('ALL', 'Tümü', currentCPT==='ALL', () => { currentCPT='ALL'; render(); }));
  Object.keys(cptCounts).sort().forEach(cpt => {
    cptBarEl.appendChild(mkTab(cpt, formatCPT(cpt) + ' (' + cptCounts[cpt] + ')', currentCPT===cpt, () => { currentCPT=cpt; render(); }));
  });
}

function mkTab(value, text, active, onclick) {
  const btn = document.createElement('button');
  btn.className = 'tab' + (active ? ' active' : '');
  btn.textContent = text;
  btn.onclick = onclick;
  return btn;
}

function formatCPT(cpt) {
  if (!cpt) return '?';
  // "Sep 22 23:20" → "22 23:20"
  return cpt.replace(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+/i, '').trim();
}

function applyThreshold() {
  const w = parseInt(document.getElementById('thrWarn').value);
  const c = parseInt(document.getElementById('thrCrit').value);
  if (!isNaN(w) && w > 0) warnThr = w;
  if (!isNaN(c) && c > 0) critThr = c;
  if (critThr <= warnThr) { critThr = warnThr + 1; document.getElementById('thrCrit').value = critThr; }
  render();
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  if (!pickerData) return;
  let totes = pickerData.totes;

  // Apply filters
  if (currentFloor !== 'ALL') {
    if (currentFloor === 'N/A') totes = totes.filter(t => !t.floor);
    else totes = totes.filter(t => t.floor === currentFloor);
  }
  if (currentPP !== 'ALL') totes = totes.filter(t => t.processPath === currentPP);
  if (currentWP !== 'ALL') totes = totes.filter(t => (t.groupWP || t.workPool) === currentWP);
  if (currentCPT !== 'ALL') totes = totes.filter(t => t.cpt === currentCPT);

  renderSummary(totes);
  renderSections(totes);
}

function renderSummary(totes) {
  const total = totes.length;
  const critCount = totes.filter(t => t.dwellMin >= critThr).length;
  const maxDwell = total ? Math.max(...totes.map(t => t.dwellMin)) : 0;
  const pickerCount = totes.filter(t => t.pickerLogin).length;

  const floorCounts = {};
  ['HRV','P1','P2','P3','P4','P5','P6'].forEach(f => floorCounts[f] = 0);
  totes.forEach(t => { if (t.floor && floorCounts.hasOwnProperty(t.floor)) floorCounts[t.floor]++; });

  let html = '';
  html += `<div class="summary-card total-card"><div class="s-value">${total}</div><div class="s-label">Total Tote</div></div>`;
  html += `<div class="summary-card"><div class="s-value" style="color:var(--error)">${critCount}</div><div class="s-label">Critical</div></div>`;
  html += `<div class="summary-card"><div class="s-value" style="color:var(--warning)">${maxDwell}</div><div class="s-label">Max Dwell</div></div>`;
  html += `<div class="summary-card"><div class="s-value" style="color:#a78bfa">${pickerCount}</div><div class="s-label">Picker</div></div>`;

  Object.keys(floorCounts).forEach(fl => {
    const cnt = floorCounts[fl];
    const isActive = currentFloor === fl;
    html += `<div class="summary-card ${isActive?'active-fl':''}" onclick="currentFloor='${fl}';buildFilters();render()">
      <div class="s-value" style="color:${FLOOR_COLORS[fl]||'#94a3b8'}">${cnt}</div>
      <div class="s-label">${fl}</div></div>`;
  });

  document.getElementById('summaryRow').innerHTML = html;
}

function renderSections(totes) {
  const body = document.getElementById('mainBody');

  // Group by CPT
  const cptGroups = {};
  totes.forEach(t => {
    if (!cptGroups[t.cpt]) cptGroups[t.cpt] = [];
    cptGroups[t.cpt].push(t);
  });

  const sortedCPTs = Object.keys(cptGroups).sort();
  if (!sortedCPTs.length) {
    body.innerHTML = '<div class="empty-state"><i class="fa-solid fa-filter-circle-xmark"></i><h3>Filtre sonucu boş</h3><p>Seçili filtrelere uyan tote bulunamadı.</p></div>';
    return;
  }

  let html = '';
  sortedCPTs.forEach((cpt, ci) => {
    const items = cptGroups[cpt];
    items.sort((a, b) => b.dwellMin - a.dwellMin);

    const critCount = items.filter(t => t.dwellMin >= critThr).length;
    const warnCount = items.filter(t => t.dwellMin >= warnThr && t.dwellMin < critThr).length;
    const maxDwell = items.length ? Math.max(...items.map(t => t.dwellMin)) : 0;
    const hasCrit = critCount > 0;
    const hasWarn = warnCount > 0;

    const cd = countdownLabel(cpt);
    const cdHTML = cd ? `<span class="countdown ${cd.cls}">${cd.text}</span>` : '';
    const cptColor = !cd ? 'var(--text)' : (cd.cls==='late'?'var(--error)':cd.cls==='soon'?'var(--warning)':'var(--success)');

    html += `<div class="cpt-section ${hasCrit?'has-crit':hasWarn?'has-warn':''}">
      <div class="cpt-header" onclick="document.getElementById('cpt-body-${ci}').classList.toggle('open');document.getElementById('cpt-chv-${ci}').classList.toggle('open')">
        <div class="left">
          <span class="chv" id="cpt-chv-${ci}">▶</span>
          <span class="cpt-label" style="color:${cptColor}">${formatCPT(cpt)}</span>
          ${cdHTML}
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-val">${items.length}</div><div class="stat-lbl">Tote</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--error)">${critCount}</div><div class="stat-lbl">Crit</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--warning)">${warnCount}</div><div class="stat-lbl">Warn</div></div>
          <div class="stat"><div class="stat-val" style="color:var(--info)">${maxDwell}</div><div class="stat-lbl">Max dk</div></div>
        </div>
      </div>
      <div class="cpt-body" id="cpt-body-${ci}">
        ${buildTable(items)}
      </div>
    </div>`;
  });

  body.innerHTML = html;
}

function buildTable(items) {
  if (!items.length) return '';
  let html = `<table class="tote-table"><thead><tr>
    <th>Dwell</th><th>Tote ID</th><th>Items</th><th>PP</th><th>WP</th><th>Kat</th><th>Picker</th><th>Outer</th><th>Mesaj</th>
  </tr></thead><tbody>`;

  items.forEach(t => {
    const dc = t.dwellMin >= critThr ? 'crit' : (t.dwellMin >= warnThr ? 'warn' : 'ok');
    const rowCls = t.dwellMin >= critThr ? 'row-crit' : (t.dwellMin >= warnThr ? 'row-warn' : '');
    const info = ppInfo(t.processPath);
    const floorCls = t.floor ? 'floor-'+t.floor : '';
    const wpLabel = WP_LABELS[t.groupWP||t.workPool] || (t.groupWP||t.workPool);

    const pickerHTML = t.pickerLogin
      ? `<span class="picker-text">👤 ${t.pickerLogin}</span>`
      : (t.scannable && t.scannable.startsWith('tsX') ? '<span class="picker-na">—</span>' : '<span class="picker-na">bin</span>');

    const msgHTML = t.pickerLogin
      ? `<button class="msg-btn" onclick="openMsgModal('${esc(t.pickerLogin)}','${esc(t.scannable)}')">📨</button>`
      : '<span class="picker-na">—</span>';

    const scLink = t.scannable.startsWith('tsX')
      ? `<a class="scannable-link" href="https://qi-fcresearch-eu.corp.amazon.com/IST2/results?s=${t.scannable}#container-history-nav" target="_blank">${t.scannable} 🔗</a>`
      : `<span style="font-family:var(--mono);font-size:10px;color:var(--text2)">${t.scannable}</span>`;

    const outerShort = (t.outer||'').replace('cvAtPM', 'PM').replace('dz-P-', '').substring(0, 18);

    html += `<tr class="${rowCls}">
      <td><span class="dwell-badge ${dc}">${t.dwellMin} dk</span></td>
      <td>${scLink}</td>
      <td style="text-align:center;font-family:var(--mono)">${t.items||t.quantity}</td>
      <td><span class="pp-badge ${info.cls}">${info.label}</span></td>
      <td style="font-size:10px;color:var(--text3)">${wpLabel}</td>
      <td>${t.floor ? `<span class="floor-badge ${floorCls}">${t.floor}</span>` : '<span class="picker-na">…</span>'}</td>
      <td>${pickerHTML}</td>
      <td style="font-size:9px;color:var(--text3);font-family:var(--mono)" title="${t.outer||''}">${outerShort}</td>
      <td>${msgHTML}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  return html;
}

function esc(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function countdownLabel(cpt) {
  if (!cpt || cpt === 'Unknown') return null;
  try {
    const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const parts = cpt.trim().split(/\s+/);
    if (parts.length < 3) return null;
    const mo = months[parts[0]];
    const da = parseInt(parts[1]);
    const [h, m] = parts[2].split(':').map(Number);
    if (mo === undefined || !da) return null;
    const cd = new Date(new Date().getFullYear(), mo, da, h, m);
    const ml = Math.round((cd - new Date()) / 60000);
    if (ml < 0) return { cls:'late', text: Math.abs(ml) + 'dk GEÇTİ' };
    if (ml < 120) return { cls:'soon', text: ml + 'dk kaldı' };
    return { cls:'ok', text: Math.round(ml/60*10)/10 + 'sa kaldı' };
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════════════
// MESSAGE MODAL
// ═══════════════════════════════════════════════════════════════
function openMsgModal(login, scannable) {
  const old = document.getElementById('msgOverlay');
  if (old) old.remove();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'msgOverlay';

  const tplHTML = MSG_TEMPLATES.map((tpl, i) => {
    const filled = tpl.replace(/\{id\}/g, scannable);
    return `<button class="tpl" data-idx="${i}" onclick="selectTpl(${i},'${esc(scannable)}')">${filled}</button>`;
  }).join('');

  overlay.innerHTML = `<div class="modal">
    <h3>📨 Mesaj Gönder</h3>
    <div class="to">Kime: <strong>${login}</strong></div>
    <div class="templates">${tplHTML}</div>
    <textarea id="msgText" placeholder="Mesajınızı yazın veya yukarıdan template seçin..."></textarea>
    <div class="actions">
      <button class="btn-cancel" onclick="closeMsgModal()">İptal</button>
      <button class="btn-send" id="sendBtn" onclick="sendMsg('${esc(login)}','${esc(scannable)}')">Gönder</button>
    </div>
  </div>`;

  overlay.addEventListener('click', e => { if (e.target === overlay) closeMsgModal(); });
  document.body.appendChild(overlay);
}

function selectTpl(idx, scannable) {
  const filled = MSG_TEMPLATES[idx].replace(/\{id\}/g, scannable);
  document.getElementById('msgText').value = filled;
  document.querySelectorAll('.tpl').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.tpl[data-idx="${idx}"]`).classList.add('selected');
}

function closeMsgModal() {
  const el = document.getElementById('msgOverlay');
  if (el) el.remove();
}

function sendMsg(login, scannable) {
  const text = document.getElementById('msgText').value.trim();
  if (!text) { alert('Mesaj boş olamaz!'); return; }
  // FANS API — Tampermonkey'den kullanılıyor, burada bilgilendirme
  alert('📨 FANS mesajı göndermek için Tampermonkey scriptini kullanın.\n\nKime: ' + login + '\nMesaj: ' + text);
  closeMsgModal();
}
</script>
